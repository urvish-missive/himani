    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(bios[which]).then(done, function(){ fallback(); }); } else fallback();
    function fallback(){ var r = document.createRange(); r.selectNodeContents(txt); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selected, press Ctrl or Cmd + C'; }
  });

  document.querySelectorAll('[data-talk]').forEach(function(a){ a.addEventListener('click', function(){
    document.getElementById('talk').value = a.dataset.talk;
    document.getElementById('fmt').value = a.dataset.talk.indexOf('workshop') > -1 ? 'Workshop' : 'Keynote';
  }); });

  document.getElementById('send').addEventListener('click', function(){
    var err = document.getElementById('err');
    var nm = document.getElementById('nm').value.trim(), em = document.getElementById('em').value.trim(), ev = document.getElementById('ev').value.trim();
    if(!nm){ err.textContent = 'Add your name so I know who I am speaking with.'; return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ err.textContent = 'Add a valid email so I can reply.'; return; }
    if(!ev){ err.textContent = 'Add the event name.'; return; }
    err.textContent = '';
    var brief = 'Speaking | ' + ev + ' | ' + (document.getElementById('dt').value || 'Date TBC') + ' | ' + (document.getElementById('loc').value.trim() || 'Location TBC') + ' | Audience: ' + document.getElementById('aud').value + ' | ' + document.getElementById('fmt').value + ' | Talk: ' + document.getElementById('talk').value + (document.getElementById('msg').value.trim() ? ' | ' + document.getElementById('msg').value.trim() : '');
    document.getElementById('d-name').textContent = nm.split(' ')[0];
    document.getElementById('cal').href = 'https://calendly.com/missivedigital/30min?name=' + encodeURIComponent(nm) + '&email=' + encodeURIComponent(em) + '&a1=' + encodeURIComponent(brief);
    document.getElementById('fields').style.display = 'none';
    document.getElementById('done').classList.add('on');
  });

  var bar = document.getElementById('hirebar'), hero = document.querySelector('.hero'), apply = document.getElementById('apply');
  if('IntersectionObserver' in window){
    var heroGone = false, applyIn = false;
    function upd(){ bar.classList.toggle('show', heroGone && !applyIn); }
    new IntersectionObserver(function(e){ heroGone = !e[0].isIntersecting; upd(); }).observe(hero);
    new IntersectionObserver(function(e){ applyIn = e[0].isIntersecting; upd(); }).observe(apply);
  }
  })();


(function(){
  var b=document.getElementById('burger'), m=document.getElementById('menu');
  if(!b||!m) return;
  b.addEventListener('click',function(){ var o=m.classList.toggle('open'); b.setAttribute('aria-expanded',String(o)); });
  m.querySelectorAll('a').forEach(function(a){ a.addEventListener('click',function(){ m.classList.remove('open'); b.setAttribute('aria-expanded','false'); }); });
})();

}};
(function(){
  var app=document.getElementById('app'), current=null;
  function routeFromHash(){ var h=location.hash; if(h.indexOf('#/')!==0) return ''; var r=h.slice(2); return (r in P)?r:''; }
  function render(r){
    if(r===current){ window.scrollTo(0,0); return; }
    current=r; var p=P[r];
    var tpl=document.getElementById('tpl-'+p.key);
    var wrap=document.createElement('div'); wrap.id='page-'+p.key; wrap.className='page';
    wrap.appendChild(tpl.content.cloneNode(true));
    app.innerHTML=''; app.appendChild(wrap);
    document.title=T[r];
    window.scrollTo(0,0);
    try{ p.run(); }catch(e){ console.error(e); }
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest('a'); if(!a) return;
    var h=a.getAttribute('href')||'';
    if(h.indexOf('#/')===0){
      e.preventDefault();
      var r=h.slice(2); if(!(r in P)) r='';
      if(location.hash!==h){ history.pushState(null,'',h); }
      render(r);
      return;
    }
    if(h==='#'){ e.preventDefault(); return; }
    if(h.charAt(0)==='#'){
      var el=document.getElementById(h.slice(1));
      if(el){ e.preventDefault(); el.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
    }
  });
  window.addEventListener('popstate',function(){ render(routeFromHash()); });
  render(routeFromHash());
})();

</script>
